name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Fixed signing key so every build installs over the last and phone and watch always match.
      # Absent for pull requests from forks; builds then use a throwaway debug key.
      XLAUTH_KEYSTORE_BASE64: ${{ secrets.XLAUTH_KEYSTORE_BASE64 }}
      XLAUTH_KEYSTORE_PASSWORD: ${{ secrets.XLAUTH_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version code is the commit count.
          fetch-depth: 0
      - name: Refuse committed signing keys
        run: |
          if git ls-files | grep -iE '\.(jks|keystore|p12|pfx)$'; then
            echo "::error::Keystore files are tracked in the repository"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37.2
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - name: Set up signing key
        if: env.XLAUTH_KEYSTORE_BASE64 != ''
        run: |
          echo "$XLAUTH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/xlauth.jks"
          echo "XLAUTH_KEYSTORE=$RUNNER_TEMP/xlauth.jks" >> "$GITHUB_ENV"
      - name: Test and build debug APKs
        run: ./gradlew -PappVersionCode="$(git rev-list --count HEAD)" :phone:testDebugUnitTest :phone:assembleDebug :wear:assembleDebug
      - name: Check phone and watch share a signing key
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          phone=$("$apksigner" verify --print-certs phone/build/outputs/apk/debug/phone-debug.apk | grep "SHA-256 digest")
          wear=$("$apksigner" verify --print-certs wear/build/outputs/apk/debug/wear-debug.apk | grep "SHA-256 digest")
          [ "$phone" = "$wear" ] || { echo "::error::Phone and watch APKs are signed with different keys"; exit 1; }
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: xl-authenticator-debug
          path: |
            phone/build/outputs/apk/debug/phone-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
