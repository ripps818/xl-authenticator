name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed signing keys
        run: |
          if git ls-files | grep -iE '\.(jks|keystore|p12|pfx)$'; then
            echo "::error::Keystore files are tracked in the repository"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37.2
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - name: Test and build debug APKs
        run: ./gradlew :phone:testDebugUnitTest :phone:assembleDebug :wear:assembleDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: xl-authenticator-debug
          path: |
            phone/build/outputs/apk/debug/phone-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
